name: Build Aseprite for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Aseprite Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Aseprite
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Download Skia
        shell: bash
        run: |
          set -e

          if [[ ! -f "laf/misc/skia-url.sh" ]]; then
            echo "ERROR: laf/misc/skia-url.sh was not found."
            exit 1
          fi

          this_dir=$(cygpath "${GITHUB_WORKSPACE}")
          skia_url=$(source "$this_dir/laf/misc/skia-url.sh" | xargs)

          if [[ -z "$skia_url" ]]; then
            echo "ERROR: Could not determine the Skia download URL."
            exit 1
          fi

          echo "Skia URL: $skia_url"

          skia_file=$(basename "$skia_url")

          curl \
            --fail \
            --location \
            --retry 3 \
            --ssl-revoke-best-effort \
            -o "$skia_file" \
            "$skia_url"

          unzip -q "$skia_file" -d skia

          if [[ ! -d "skia/out/Release-x64" ]]; then
            echo "ERROR: Expected Skia directory skia/out/Release-x64 was not found."
            find skia -maxdepth 3 -type d | head -100 || true
            exit 1
          fi

      - name: Configure CMake
        shell: bash
        run: |
          set -e

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-x64)"

      - name: Build Aseprite
        shell: bash
        run: |
          set -e
          cmake --build build --target aseprite --parallel

      - name: Verify executable
        shell: powershell
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "build\bin\aseprite.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Aseprite executable was not created: $exe"
            exit 1
          }

          Write-Host "Aseprite executable:"
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Prepare portable package
        shell: powershell
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE "build\bin"
          $package = Join-Path $env:GITHUB_WORKSPACE "Aseprite-Windows-x64"

          if (Test-Path $package) {
            Remove-Item $package -Recurse -Force
          }

          New-Item -ItemType Directory -Path $package | Out-Null

          # The Aseprite build output contains the executable and the runtime
          # resources produced/required by the current build.
          Copy-Item "$bin\*" $package -Recurse -Force

          # Copy license / source notices when present.
          foreach ($name in @(
            "EULA.txt",
            "LICENSE.txt",
            "LICENSE",
            "README.md"
          )) {
            $src = Join-Path $env:GITHUB_WORKSPACE $name
            if (Test-Path $src) {
              Copy-Item $src $package -Force
            }
          }

          # Keep a small build-information file beside the executable.
          @"
          Aseprite Windows x64
          Build type: Release
          Backend: Skia
          Scripting: Lua
          Built by: GitHub Actions
          Repository: $env:GITHUB_REPOSITORY
          Commit: $env:GITHUB_SHA
          "@ | Set-Content (Join-Path $package "BUILD-INFO.txt") -Encoding UTF8

          Write-Host "Portable package contents:"
          Get-ChildItem $package -Recurse | Select-Object FullName,Length

      - name: Smoke test executable
        shell: powershell
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "Aseprite-Windows-x64\aseprite.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "Packaged aseprite.exe not found."
            exit 1
          }

          # --version is a lightweight CLI smoke test and should not open the GUI.
          & $exe --version

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Aseprite --version failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }

      - name: Create ZIP
        shell: powershell
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "Aseprite-Windows-x64"
          $zip = Join-Path $env:GITHUB_WORKSPACE "Aseprite-Windows-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            Write-Error "ZIP file was not created."
            exit 1
          }

          Write-Host "Created package:"
          Get-Item $zip | Format-List FullName,Length,LastWriteTime

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: Aseprite-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
