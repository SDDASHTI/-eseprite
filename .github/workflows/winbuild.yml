name: Build Aseprite for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Aseprite Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Aseprite
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Download Skia
        shell: bash
        run: |
          set -e

          if [[ ! -f "laf/misc/skia-url.sh" ]]; then
            echo "ERROR: laf/misc/skia-url.sh was not found."
            exit 1
          fi

          this_dir=$(cygpath "${GITHUB_WORKSPACE}")
          skia_url=$(source "$this_dir/laf/misc/skia-url.sh" | xargs)

          if [[ -z "$skia_url" ]]; then
            echo "ERROR: Could not determine the Skia download URL."
            exit 1
          fi

          echo "Skia URL: $skia_url"

          skia_file=$(basename "$skia_url")

          curl \
            --fail \
            --location \
            --retry 3 \
            --ssl-revoke-best-effort \
            -o "$skia_file" \
            "$skia_url"

          unzip -q "$skia_file" -d skia

          if [[ ! -d "skia/out/Release-x64" ]]; then
            echo "ERROR: Expected Skia directory skia/out/Release-x64 was not found."
            find skia -maxdepth 3 -type d | head -100 || true
            exit 1
          fi

      - name: Configure CMake
        shell: bash
        run: |
          set -e

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-x64)"

      - name: Build Aseprite
        shell: bash
        run: |
          set -e

          cmake --build build --target aseprite --parallel

      - name: Verify executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Join-Path $env:GITHUB_WORKSPACE "build\bin\aseprite.exe"

          if (-not (Test-Path $exe)) {
            throw "Aseprite executable was not created: $exe"
          }

          Write-Host "Aseprite executable found:"
          Get-Item $exe | Format-List FullName,Length,LastWriteTime

      - name: Prepare portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $bin = Join-Path $env:GITHUB_WORKSPACE "build\bin"
          $package = Join-Path $env:GITHUB_WORKSPACE "Aseprite-Windows-x64"

          if (-not (Test-Path $bin)) {
            throw "Build output directory not found: $bin"
          }

          if (Test-Path $package) {
            Remove-Item $package -Recurse -Force
          }

          New-Item -ItemType Directory -Path $package | Out-Null

          Copy-Item "$bin\*" $package -Recurse -Force

          foreach ($name in @(
            "EULA.txt",
            "LICENSE.txt",
            "LICENSE",
            "README.md"
          )) {
            $src = Join-Path $env:GITHUB_WORKSPACE $name

            if (Test-Path $src) {
              Copy-Item $src $package -Force
            }
          }

          $buildInfo = @"
Aseprite Windows x64
Build type: Release
Backend: Skia
Scripting: Lua
Built by: GitHub Actions
Repository: $env:GITHUB_REPOSITORY
Commit: $env:GITHUB_SHA
"@

          $buildInfo | Set-Content `
            (Join-Path $package "BUILD-INFO.txt") `
            -Encoding UTF8

          Write-Host ""
          Write-Host "Portable package contents:"
          Get-ChildItem $package -Recurse |
            Select-Object FullName,Length

      - name: Smoke test executable
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Aseprite-Windows-x64\aseprite.exe"

          if (-not (Test-Path $exe)) {
            throw "Packaged aseprite.exe not found: $exe"
          }

          Write-Host "========================================"
          Write-Host "Aseprite Smoke Test"
          Write-Host "========================================"
          Write-Host "Executable: $exe"
          Write-Host ""

          $output = & $exe --version 2>&1
          $exitCode = $LASTEXITCODE

          Write-Host "Aseprite output:"
          $output | ForEach-Object {
            Write-Host $_
          }

          Write-Host ""
          Write-Host "Process exit code: $exitCode"
          Write-Host ""

          $versionText = ($output | Out-String).Trim()

          if ($versionText -match "Aseprite\s+\S+") {
            Write-Host "SUCCESS: Aseprite executable is working."
            Write-Host "Detected version: $versionText"
            exit 0
          }

          Write-Error "Aseprite did not return valid version information."

          if ($exitCode -ne 0) {
            Write-Error "Process exit code: $exitCode"
          }

          exit 1

      - name: Create ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Aseprite-Windows-x64"

          $zip = Join-Path `
            $env:GITHUB_WORKSPACE `
            "Aseprite-Windows-x64.zip"

          if (-not (Test-Path $package)) {
            throw "Portable package not found: $package"
          }

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "ZIP file was not created."
          }

          Write-Host "Created package:"
          Get-Item $zip |
            Format-List FullName,Length,LastWriteTime

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: Aseprite-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
